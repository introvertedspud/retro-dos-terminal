name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Node ${{ matrix.node }} / React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        react: [19]
        include:
          # Oldest React in the peer range
          - node: 24
            react: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.react == 18
        run: npm install --no-save react@18 react-dom@18
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:exports
